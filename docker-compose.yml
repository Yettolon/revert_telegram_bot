version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: revert_bot_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network
    restart: unless-stopped
    mem_limit: 200m

  # Telegram Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revert_bot
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - ./logs:/app/logs
    networks:
      - bot_network
    restart: unless-stopped
    mem_limit: 180m


  go_worker:
    build:
      context: .
      dockerfile: Dockerfile.go
    container_name: revert_bot_go_worker
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - LOGS_DIR=/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - bot_network
    restart: unless-stopped
    mem_limit: 50m
    command: ["./worker", "daemon"]
  
networks:
  bot_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local